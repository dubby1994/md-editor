<!-- ─────────────────────────────  WORKSPACE  ───────────────────────────── -->
<main class="workspace" id="workspace">

  <!-- TOC sidebar -->
  <aside class="toc-pane" id="tocPane" aria-label="Document outline">
    <div class="toc-head">
      <span>Outline</span>
      <button class="icon-btn sm" id="tocClose" title="Close"><svg viewBox="0 0 16 16" width="13" height="13"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
    <nav class="toc-list" id="tocList"></nav>
  </aside>

  <!-- Editor -->
  <section class="editor-pane" id="editorPane">
    <div class="editor-wrap">
      <div class="line-numbers" id="lineNumbers" aria-hidden="true"></div>
      <textarea id="editor" spellcheck="true" autocapitalize="off" placeholder="# Begin your story…"></textarea>
    </div>
  </section>

  <!-- Resizer -->
  <div class="resizer" id="resizer" title="Drag to resize"></div>

  <!-- Preview -->
  <section class="preview-pane" id="previewPane">
    <article class="prose" id="preview"></article>
  </section>

</main>
